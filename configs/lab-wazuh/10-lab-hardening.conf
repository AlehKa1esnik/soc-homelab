# /etc/ssh/sshd_config.d/10-lab-hardening.conf на lab-wazuh.
# sshd берёт первое встреченное значение и читает sshd_config.d по алфавиту,
# поэтому 10-... срабатывает раньше 50-cloud-init.conf.
# Проверка: sudo sshd -t && sudo sshd -T | grep -E '^(passwordauthentication|kbdinteractiveauthentication|permitrootlogin) '
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
